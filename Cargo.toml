[package]
name = "agentboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Tiny task board + tmux bridge for a team of CLI coding agents"
license = "MIT"

[[bin]]
name = "agentboard"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-io"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }

[profile.release]
opt-level = 2
