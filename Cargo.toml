[package]
name = "agentboard"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Shared task board for a team of CLI agents"
license = "MIT"

[[bin]]
name = "agentboard"
path = "src/main.rs"

[features]
default = []
dashboard = []

[dependencies]
# No colour stack: help and errors are plain text on purpose.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
heed = "0.23.0"
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
opt-level = 2
