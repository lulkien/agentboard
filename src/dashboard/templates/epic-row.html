<article class="epic-row depth-{{depth}}"><div class="epic-heading">{{strip}}{{parent_link}}<span class="meta">Priority {{priority}}</span></div><div class="epic-rollup"><svg class="rollup-bar" viewBox="0 0 100 10" role="img" aria-label="{{done}} of {{total}} direct children done" preserveAspectRatio="none">{{rects}}</svg><span class="progress-copy">{{progress}} / {{total}} done</span><ul class="counts">{{counts}}</ul><a href="{{children_href}}">All children</a></div><ul class="strip-list epic-children">{{children}}</ul>{{more}}</article>
