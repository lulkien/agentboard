<nav class="status-chips" aria-label="Task status">{{status_chips}}</nav><section class="panel"><form id="task-filter" method="get" action="/tasks"><label>Status<select name="status"><option value="">All statuses</option>{{status_options}}</select></label><label>Assignee<input name="assignee" value="{{assignee}}" autocomplete="off"></label><label>Parent ID<input name="parent" inputmode="numeric" value="{{parent}}"></label><button type="submit">Apply filters</button></form>{{project_input}}{{parent_note}}<p class="result-count">Showing {{start}}–{{end}} of {{total}} tasks</p><div class="table-scroll"><table class="task-table"><thead><tr><th scope="col">ID</th><th scope="col">Status</th><th scope="col">Title</th><th scope="col">Assignee</th><th scope="col">Project</th><th scope="col">Priority</th></tr></thead><tbody>{{empty_row}}{{rows}}</tbody></table></div><nav class="pagination" aria-label="Task pages">{{previous}}<span>Page {{page_number}} of {{page_count}}</span>{{next}}</nav></section>
