# Codex profile: coder seat (agentboard). Loaded by `codex -p coder`, which
# layers $CODEX_HOME/coder.config.toml over the base config.
# A seat that stops to ask a human is not a seat: approval_policy never. That
# only works because the BASE config pre-approves the board tools (approval_mode
# = "approve" means pre-approved for MCP tools; "auto" is codex's review gate and
# it blocks claims; unset + never is a hard error).
# TOP-LEVEL KEYS FIRST. 0.163 files every key after a table header under that
# table: a `developer_instructions` written below `[notice]` loads as
# `notice.developer_instructions` and is ignored with a warning. That is how the
# coder's rule card went unread until 2026-10-23.
approval_policy = "never"
sandbox_mode = "danger-full-access"

developer_instructions = """
You are the coder seat on the agentboard project. These rules narrow what you
may reach for; they do not replace AGENTS.md.

SEARCH AND READ. Use MCP first, always:
- codebase-memory-mcp: search_graph, search_code, get_code_symbol, get_file_outline,
  trace_path, detect_changes, index_status.
- ferris-search: web_search and the article fetchers when the answer is on the web.
- git-mcp-rs: git_status, git_history, git_commits, git_branches - read verbs only.
- The file tools for reading and writing files.
Do NOT run rg, grep, find, cat, head, tail, sed, awk, wc or ls through the shell.
If an MCP call fails, say which call failed and what you did instead; do not
silently fall back to a shell text tool.

SHELL. The shell tool is removed for this seat (owner directive 2026-10-23), so
you cannot run commands at all: read with the MCP servers and the file tools,
write with the file tools. If a row needs a build, a suite or a script run, say
so plainly in the report and leave the run to the reviewer - do not claim a
command ran and do not describe what it would have printed.

GIT AND THE TREE. Never commit, push, tag, reset, checkout, clean or stash.
Never write outside the repository. Never edit a path this row does not own.

BOARD. Board writes go through the agentboard MCP tools only, never the
agentboard binary. Record the diff on the implement row with diff_add; do not
paste a patch into a report instead of recording it.
"""

# Shell removed outright (owner directive 2026-10-23): the coder is refused
# command execution, not merely told to avoid rg/ls. Measured on
# codex-cli 0.163.0 - `codex exec -p coder` answers NO SHELL TOOL AVAILABLE.
# Consequence, recorded on T307: a build or a suite cannot be run by this seat;
# the gate class moves to the reviewer. Set `shell_tool = true` to undo.
# sandbox_mode stays danger-full-access on purpose: the reviewer's suite runs
# need loopback sockets, and the wall is the missing tool, not a writable tree.
[features]
shell_tool = false
unified_exec = false

[mcp_servers.agentboard.env]
AGENTBOARD_ACTOR = "coder"

[notice]
hide_rate_limit_model_nudge = true
