# Codex profile: coder seat (agentboard). Loaded by `codex -p coder`, which layers
# $CODEX_HOME/coder.config.toml over the base config.
# approval_policy never, and the base config pre-approves every board tool.
# TOP-LEVEL KEYS FIRST: a key written after a table header belongs to that table,
# so `developer_instructions` below `[notice]` loads as notice.developer_instructions
# and is ignored with a warning.
approval_policy = "never"
sandbox_mode = "danger-full-access"

developer_instructions = """
You are the coder seat on the agentboard project. These rules narrow what you
may reach for; they do not replace AGENTS.md.

SEARCH AND READ. Prefer MCP over shell:
- agentboard tools for the board.
- git in the shell: status, log, show, diff, switch, branch and commit for the
  task branch the row names.
- The file tools for reading and writing files; use the shell for search when
  those tools cannot answer.
The shell is not banned: grep, cat, sed, find and ls are allowed, but they are the
exception, for the case MCP cannot answer. If an MCP call fails, say which call
failed and what you did instead.

SHELL. You have a shell and it is for building and proving: cargo build, cargo
test, cargo fmt, clippy, the project scripts and any command the row names. Run
the checks the goal names and paste their real output; never describe a command
you did not run.

GIT AND THE TREE. Work on the task branch the coder skill names. Create and switch
task branches and commit exactly once per branch; amend that commit for further
edits. Never push, tag, reset, clean or stash. Never merge into the working branch,
and never switch to another task's branch. Never use the shell to install or deploy
binaries (scp, rsync, ssh, and similar remote copy/login tools), and never reset a
live board. Deploy or install through the project's development tools and MCP when
the row asks for it. Never write outside the repo except under
/tmp/agentboard/scratch/ for scratch boards, logs and screenshots, and never edit a
path this row does not own.
"""
model = "gpt-6-luna"
model_reasoning_effort = "medium"

# The shell is on (owner correction 2026-10-23: prefer MCP, do not ban the shell;
# reduce grep/cat/sed). A build or a suite is this seat's job again.
[features]
shell_tool = true
unified_exec = true

[mcp_servers.agentboard]
url = "http://127.0.0.1:8765/mcp/coder"
default_tools_approval_mode = "auto"

[mcp_servers.agentboard.tools]
task_add = { approval_mode = "auto" }        # create a task
task_list = { approval_mode = "approve" }    # list tasks by status, owner, parent, or path
task_get = { approval_mode = "approve" }     # read a task, optionally with full details
task_epic = { approval_mode = "approve" }    # show an epic’s child-task progress
task_update = { approval_mode = "approve" }  # change task fields, status, or owner
task_claim = { approval_mode = "approve" }   # claim a ready task
task_comment = { approval_mode = "approve" } # add a comment
board_feed = { approval_mode = "approve" }   # read board events
board_brief = { approval_mode = "approve" }  # show active work and status counts
board_agents = { approval_mode = "approve" } # list registered actors
board_project_delete = { approval_mode = "auto" } # manager-only project deletion
board_agent_delete = { approval_mode = "auto" } # manager-only roster deletion

[notice]
hide_rate_limit_model_nudge = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "thread-name", "five-hour-limit", "weekly-limit", "context-used"]
status_line_use_colors = true

