# Codex profile: manager seat (agentboard). Loaded by `codex -p manager`, which
# layers $CODEX_HOME/manager.config.toml over the base config.
# A seat that stops to ask a human is not a seat: approval_policy never, and no
# per-tool approval_mode is set, because "never" turns any tool that needs
# approval into a hard error instead of a prompt. Authority is the playbook's
# job (roles.md), the sandbox is the part that cannot be argued with.
approval_policy = "never"
sandbox_mode = "workspace-write"

[mcp_servers.agentboard.env]
AGENTBOARD_ACTOR = "manager"
