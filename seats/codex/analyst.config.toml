# Codex profile: analyst seat (agentboard). Loaded by `codex -p analyst`, which
# layers $CODEX_HOME/analyst.config.toml over the base config.
# approval_policy never, so the seat never stops to ask a human; the base config
# pre-approves every board tool, because "never" turns an unapproved tool into a
# hard error instead of a prompt.
# The named permission profile keeps the checkout readable and limits writes to
# /tmp/agentboard/scratch. The pane can stay rooted in the repository.
approval_policy = "never"
default_permissions = "seat-scratch"
developer_instructions = """
Prefer MCP over shell for reading and searching: codebase-memory-mcp for symbols,
callers and file outlines; git-mcp-rs for git reads; ferris-search for the web; the
agentboard tools for the board; the file tools for files. The shell is the
exception, for what no MCP tool answers (rg for plain text search). If an MCP call
fails, say which call failed and what you did instead.
"""
model = "gpt-6-sol"
model_reasoning_effort = "high"

[permissions.seat-scratch.filesystem]
":minimal" = "read"
"/tmp/agentboard/scratch" = "write"

[permissions.seat-scratch.filesystem.":workspace_roots"]
"." = "read"

[mcp_servers.git-mcp-rs]
command = "git-mcp-rs"
default_tools_approval_mode = "approve"

[mcp_servers.ferris-search]
command = "ferris-search"
default_tools_approval_mode = "approve"

[mcp_servers.codebase-memory-mcp]
command = "codebase-memory-mcp"
default_tools_approval_mode = "approve"

[mcp_servers.agentboard]
command = "agentboard"
default_tools_approval_mode = "auto"

[mcp_servers.agentboard.env]
AGENTBOARD_ACTOR = "analyst"

[mcp_servers.agentboard.tools]
task_add = { approval_mode = "auto" }        # create a task
task_list = { approval_mode = "approve" }    # list tasks by status, owner, parent, or path
task_get = { approval_mode = "approve" }     # read a task, optionally with full details
task_epic = { approval_mode = "approve" }    # show an epic’s child-task progress
task_update = { approval_mode = "approve" }  # change task fields, status, or owner
task_claim = { approval_mode = "approve" }   # claim a ready task
task_comment = { approval_mode = "approve" } # add a comment
board_feed = { approval_mode = "approve" }   # read board events
board_brief = { approval_mode = "approve" }  # show active work and status counts
board_agents = { approval_mode = "approve" } # list registered actors

