# Codex profile: reviewer seat (agentboard). Loaded by `codex -p reviewer`, which
# layers $CODEX_HOME/reviewer.config.toml over the base config.
# approval_policy never, and the base config pre-approves every board tool.
#
# read-only over the checkout AND no shell (owner directive). The two are separate
# walls: sandbox_mode blocks writes, it does not block execution, so a reviewer
# with a shell could still run python, rg or a suite inside a read-only tree. The
# review is a reading job - the verdict goes on the board row, not into a file -
# so the shell is removed outright rather than narrowed.
#
# With approval_policy never, a tool left on "auto" is refused ("requires approval,
# but approval policy is never"). Every board read the reviewer needs is therefore
# "approve"; only task_add stays "auto", so it cannot file work.
approval_policy = "never"
sandbox_mode = "read-only"
developer_instructions = """
Read code through MCP: codebase-memory-mcp for symbols, callers and file outlines;
git-mcp-rs for git reads; the agentboard tools for the board; the file tools for
files. If an MCP call fails, say which call failed and what you did instead.
"""

[features]
shell_tool = false
unified_exec = false

[mcp_servers.git-mcp-rs]
command = "git-mcp-rs"
default_tools_approval_mode = "approve"

[mcp_servers.codebase-memory-mcp]
command = "codebase-memory-mcp"
default_tools_approval_mode = "approve"

[mcp_servers.agentboard]
command = "agentboard"
default_tools_approval_mode = "auto"

[mcp_servers.agentboard.env]
AGENTBOARD_ACTOR = "reviewer"

[mcp_servers.agentboard.tools]
task_add = { approval_mode = "auto" }        # create a task
task_list = { approval_mode = "approve" }    # list tasks by status, owner, parent, or path
task_get = { approval_mode = "approve" }     # read a task, optionally with full details
task_epic = { approval_mode = "approve" }    # show an epic’s child-task progress
task_update = { approval_mode = "approve" }  # change task fields, status, or owner
task_claim = { approval_mode = "approve" }   # claim a ready task
task_comment = { approval_mode = "approve" } # add a comment
board_feed = { approval_mode = "approve" }   # read board events
board_brief = { approval_mode = "approve" }  # show active work and status counts
board_agents = { approval_mode = "approve" } # list registered actors

