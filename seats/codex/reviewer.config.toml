# Codex profile: reviewer seat (agentboard). Loaded by `codex -p reviewer`, which
# layers $CODEX_HOME/reviewer.config.toml over the base config.
# approval_policy never, and the base config pre-approves every board tool.
# The reviewer can run tests against the coder's prebuilt binary. Its checkout
# remains read-only; only /tmp/agentboard/scratch is writable. The network proxy
# permits loopback listeners while blocking outbound access. Host command rules
# with decision="allow" run outside the sandbox; unmatched commands stay inside.
#
# With approval_policy never, a tool left on "auto" is refused ("requires approval,
# but approval policy is never"). Every board read the reviewer needs is therefore
# "approve"; only task_add stays "auto", so it cannot file work.
approval_policy = "never"
default_permissions = "reviewer-scratch"
developer_instructions = """
Read code with the file tools and use the agentboard tools for the board. Git is
read-only: use only `git diff`, `git log`, `git show`, and `git status`. Verify with
`TMPDIR=$(mktemp -d /tmp/agentboard/scratch/review.XXXXXX) PATH=$PWD/.venv/bin:$PATH bash scripts/gate.sh --prebuilt`, or run an individual suite with
the same TMPDIR and PATH plus `PYTHONDONTWRITEBYTECODE=1 AGENTBOARD_TEST_BIN=$PWD/target/release/agentboard`.
The gate uses the already-built release binary and scratch boards. Direct binary
invocations must use `env AGENTBOARD_DB=<scratch directory> ./target/release/agentboard ...`.
If the binary is missing or stale, report it; never build. Never run cargo, git
writes, or edit tracked files. Stop every process you start.
"""
model = "gpt-6-sol"
model_reasoning_effort = "medium"

[features]
shell_tool = true
unified_exec = true
network_proxy = true

[permissions.reviewer-scratch]
extends = ":read-only"

[permissions.reviewer-scratch.filesystem]
"/tmp/agentboard/scratch" = "write"

[permissions.reviewer-scratch.network]
enabled = true

[mcp_servers.agentboard]
url = "http://127.0.0.1:8765/mcp/reviewer"
default_tools_approval_mode = "auto"

[mcp_servers.agentboard.tools]
task_add = { approval_mode = "auto" }        # create a task
task_list = { approval_mode = "approve" }    # list tasks by status, owner, parent, or path
task_get = { approval_mode = "approve" }     # read a task, optionally with full details
task_epic = { approval_mode = "approve" }    # show an epic’s child-task progress
task_update = { approval_mode = "approve" }  # change task fields, status, or owner
task_claim = { approval_mode = "approve" }   # claim a ready task
task_comment = { approval_mode = "approve" } # add a comment
board_feed = { approval_mode = "approve" }   # read board events
board_brief = { approval_mode = "approve" }  # show active work and status counts
board_agents = { approval_mode = "approve" } # list registered actors
board_project_delete = { approval_mode = "auto" } # manager-only project deletion
board_agent_delete = { approval_mode = "auto" } # manager-only roster deletion

[notice]
hide_rate_limit_model_nudge = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "thread-name", "five-hour-limit", "weekly-limit", "context-used"]
status_line_use_colors = true

