# Hermes manager seat: the part of ~/.hermes/config.yaml that is about the seat.
#
# An extract, not the whole profile. A Hermes profile also holds host state that
# has no business in a repo: model providers and their key_env names,
# custom_providers, onboarding flags, telemetry, _config_version, the known_*
# bookkeeping lists and session_reset. Those stay in ~/.hermes/config.yaml, which
# is why this file is NOT symlinked over it - the live profile is the union of
# this extract and that host state.
#
# Hermes is the manager seat here, and `manager up` has no hermes argv (its
# seat_args covers claude, opencode and codex), so this card is applied by the
# human starting the manager, not by the manager verbs.

agent:
  max_turns: 150
  reasoning_effort: high
compression:
  threshold: 0.5
  tail_mode: lean
approvals:
  destructive_slash_confirm: false
  mcp_reload_confirm: false
memory:
  provider: hindsight
computer_use:
  backend: cua
plugins:
  enabled:
    - herdr-agent-state
    - rtk-rewrite
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
mcp_servers:
  agentboard:
    command: agentboard
    env:
      AGENTBOARD_ACTOR: hermes
    enabled: true
  codebase-memory-mcp:
    command: codebase-memory-mcp
    enabled: true
  git:
    command: git-mcp-rs
    enabled: true
  ferris-search:
    command: ferris-search
    enabled: true
    env:
      DEFAULT_SEARCH_ENGINE: duckduckgo
