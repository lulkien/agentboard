# Shared Codex config for every agentboard seat. Merge this into
# $CODEX_HOME/config.toml (default ~/.codex/config.toml); the role cards in this
# directory are layered over it by `codex -p <role>`.
#
# No absolute paths, on purpose: the MCP servers are named by command, and codex
# resolves them on the seat's PATH (measured 2026-10-23: `command = "agentboard"`
# starts the server and a board_brief call answers). The seat's PATH must carry
# ~/.cargo/bin and ~/.local/bin, which the shell that starts a pane already has.
#
# Not carried here, on purpose: [tui], [projects."..."].trust_level and [notice]
# are host state, not policy. A seat's trust in a checkout is a fact about this
# machine, not about the role.
#
# approval_mode, measured on codex-cli 0.163.0 (2026-10-23): a per-tool key is
# the form that works; a server-level `approval_mode` is ignored by name on every
# start, and the server-wide form is `default_tools_approval_mode`. This matters
# because every seat runs approval_policy = "never", and under "never" a tool
# with no approval mode is a hard error instead of a prompt.

[mcp_servers.agentboard]
command = "agentboard"

[mcp_servers.agentboard.tools.task_ask]
approval_mode = "approve"

[mcp_servers.agentboard.tools.task_claim]
approval_mode = "approve"

[mcp_servers.agentboard.tools.task_update]
approval_mode = "approve"

[mcp_servers.agentboard.tools.diff_add]
approval_mode = "approve"

[mcp_servers.agentboard.tools.task_add]
approval_mode = "approve"

[mcp_servers.agentboard.tools.task_dispatch]
approval_mode = "approve"

[mcp_servers.agentboard.tools.epic_add]
approval_mode = "approve"

[mcp_servers.agentboard.tools.epic_update]
approval_mode = "approve"

[mcp_servers.agentboard.tools.session_register]
approval_mode = "approve"

# Role-shared search and git servers. Same set the claude and opencode seats
# carry (~/.claude/coding-mcp.json, ~/.config/opencode/opencode.json).
[mcp_servers.git-mcp-rs]
command = "git-mcp-rs"
default_tools_approval_mode = "approve"

[mcp_servers.ferris-search]
command = "ferris-search"
default_tools_approval_mode = "approve"

[mcp_servers.codebase-memory-mcp]
command = "codebase-memory-mcp"
default_tools_approval_mode = "approve"
