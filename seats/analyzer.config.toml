# Codex profile: analyzer seat (agentboard). Loaded by `codex -p analyzer`, which
# layers $CODEX_HOME/analyzer.config.toml over the base config.
# A seat that stops to ask a human is not a seat: approval_policy never, and no
# per-tool approval_mode is set, because "never" turns any tool that needs
# approval into a hard error instead of a prompt. Authority is the playbook's
# job (roles.md), the sandbox is the part that cannot be argued with.
#
# workspace-write, and the pane is rooted in a scratch directory rather than the
# checkout (measured 2026-10-23, codex-cli 0.163.0): writes are confined to the
# working directory plus /tmp, so a probe fixture and a CLI's own session state
# work while the repository answers `read-only filesystem`, exit 1. That pair is
# the whole reason for this shape - the analyzer reads the repo, probes in
# scratch, and cannot write the tree. Rooting it in the repo with this mode
# would hand it the checkout; rooting it in scratch with read-only would block
# every probe.
approval_policy = "never"
sandbox_mode = "workspace-write"

[mcp_servers.agentboard.env]
AGENTBOARD_ACTOR = "analyzer"
